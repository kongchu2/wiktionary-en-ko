name: Build and release

on:
  push:
    branches: [main]
    paths: ["translations/**", "source/**", "enko/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch Yomitan schemas
        run: python -m enko fetch

      - name: Build
        run: python -m enko build

      - name: Validate
        run: python -m enko validate

      - name: Skip if content is unchanged
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s translations/terms.jsonl ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing translated yet."
          elif gh release download --repo "$GITHUB_REPOSITORY" --pattern content.sha256 --output previous.sha256 2>/dev/null \
             && cmp -s previous.sha256 dist/content.sha256; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No content change since the latest release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rev=$(python -c "import json; print(json.load(open('dist/wiktionary-en-ko-index.json'))['revision'])")
          src=$(cat source/VERSION)
          translated=$(wc -l < translations/terms.jsonl)
          gh release create "v$rev" dist/*.zip dist/*-index.json dist/content.sha256 \
            --title "Wiktionary-en-ko $rev" \
            --notes "Wiktionary-en-ko 자동 빌드

          - 원본: 영어 위키낱말사전 (kaikki.org $src)
          - 번역된 항목: $translated

          Yomitan → 설정 → 사전 → 가져오기에서 zip 파일을 불러오세요."
